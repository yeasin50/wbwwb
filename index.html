<!-- Game Script -->
<script type="module">
  import { spriteManager, Sprites } from "./sprites/sprite_manager.js";
  spriteManager.setLanguage("bn");

  Game.stats = false;

  window.onload = function() {
      try {
          // Initialize game
          Game.init();
      } catch (e) {
          // Show warning overlay and set text
          const warningOverlay = document.getElementById("warning");
          warningOverlay.style.display = "block";
          document.querySelector('#warning .msg-title').innerHTML = textStrings.warningTitle;
          document.querySelector('#warning .msg-text').innerHTML = textStrings.warningText;
      }

      // Update paused overlay text
      document.querySelector('#paused .msg-title').innerHTML = textStrings.pausedTitle;
      document.querySelector('#paused .msg-text').innerHTML = textStrings.pausedText;
  };

  // Set share text
  window.SHARE_TEXT = textStrings.shareText;
  window.SHARE_URL = "";
</script>
